name: TradeLocker Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r sync/requirements.txt

      - name: Run TradeLocker sync (all accounts)
        env:
          TL_ACCOUNTS: ${{ secrets.TL_ACCOUNTS }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: python sync/tradelocker_sync.py

      - name: Reconcile P&L from balance changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync/compute_pnl.py
